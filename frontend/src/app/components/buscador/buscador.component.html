<div class="container mainbox">
  <div class="contenido">
    <mat-icon class="me-1">search</mat-icon>
    <ion-label>{{ "HOME.BUSCADOR.BUSCARVIAJE" | translate }}</ion-label>
    <div class="ion-padding" slot="content">
      <ion-grid>
        <ion-row class="contenido d-flex justify-content-center">
          <!-- Campo Desde -->
          <ion-col class="columna" size="12" size-md="3">
            <div class="input-container">
              <mat-icon>share_location</mat-icon>
              <ion-input class="inputs" label="{{ 'HOME.BUSCADOR.DESDE' | translate }}" labelPlacement="floating"
                maxlength="20" [(ngModel)]="origen" (ionInput)="obtenerSugerenciasOrigen($event)">
              </ion-input>
              <ul *ngIf="sugerenciasOrigen.length > 0" class="list-group lista_sugerencias">
                <li *ngFor="let localidad of sugerenciasOrigen" class="list-group-item"
                  (click)="seleccionarLocalidadOrigen(localidad)">
                  {{ localidad.descripcion.split(",")[0].trim() }} -
                  {{ localidad.provincia }}
                </li>
              </ul>
            </div>
          </ion-col>

          <!-- Campo Hasta -->
          <ion-col class="columna" size="12" size-md="3">
            <div class="input-container">
              <mat-icon>share_location</mat-icon>
              <ion-input class="inputs" label="{{ 'HOME.BUSCADOR.A' | translate }}" labelPlacement="floating"
                maxlength="20" [(ngModel)]="destino" (ionInput)="obtenerSugerenciasDestino($event)">
              </ion-input>
              <ul *ngIf="sugerenciasDestino.length > 0" class="list-group lista_sugerencias">
                <li *ngFor="let localidad of sugerenciasDestino" class="list-group-item"
                  (click)="seleccionarLocalidadDestino(localidad)">
                  {{ localidad.descripcion.split(",")[0].trim() }} -
                  {{ localidad.provincia }}
                </li>
              </ul>
            </div>
          </ion-col>

          <!-- Campo Cuando -->
          <ion-col class="columna" size="12" size-md="3">
            <div class="input-container">
              <mat-icon>schedule</mat-icon>
              <ion-input class="inputs" label="{{ 'HOME.BUSCADOR.CUANDO' | translate }}" labelPlacement="floating"
                type="date" [(ngModel)]="fecha_salida">
              </ion-input>
            </div>
          </ion-col>
        </ion-row>
      </ion-grid>

      <ion-row>
        <ion-col>
          <!-- Botón para buscar -->
          <div class="caja_boton">
            <p-toast position="bottom-center"></p-toast>
            <button mat-raised-button class="btn_config btn btn_bg" (click)="openSearchTravels()">
              <mat-icon>search</mat-icon>
              {{ "BOTON.BUSCAR" | translate }}
            </button>
          </div>
        </ion-col>
        <ion-col>
          <!-- Botón para limpiar los campos -->
          <div class="caja_boton">
            <button mat-raised-button class="btn_limpiar btn btn_bg" (click)="limpiarBusqueda()">
              <i class="fi fi-rs-clean"></i>
              Limpiar búsqueda
            </button>
          </div>
        </ion-col>
      </ion-row>


    </div>
  </div>


</div>
