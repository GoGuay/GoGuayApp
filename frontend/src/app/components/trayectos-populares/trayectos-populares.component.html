<h1>{{ "HOME.TRAYECTOS_POPULARES" | translate }}</h1>

<div class="table-wrapper">
  <table mat-table [dataSource]="dataSource">

    <!-- Ciudad -->
    <ng-container matColumnDef="ciudad">
      <th mat-header-cell *matHeaderCellDef> Ciudad </th>
      <td mat-cell *matCellDef="let element"> {{ element.ciudad }} </td>
    </ng-container>

    <!-- Fecha -->
    <ng-container matColumnDef="fecha">
      <th mat-header-cell *matHeaderCellDef> Fecha </th>
      <td mat-cell *matCellDef="let element"> {{ element.fecha }} </td>
    </ng-container>

    <!-- Detalles -->
    <ng-container matColumnDef="detalles">
      <th mat-header-cell *matHeaderCellDef> Detalles </th>
      <td mat-cell *matCellDef="let element">
        {{ element.detalles | slice:0:50 }}<span *ngIf="element.detalles.length > 50">...</span>
        <button *ngIf="element.detalles.length > 50" mat-button (click)="openDetallesModal(element)">
          Leer más
        </button>
      </td>
    </ng-container>

    <!-- Viaje -->
    <ng-container matColumnDef="viaje">
      <th mat-header-cell *matHeaderCellDef> 
        <span class="viaje-texto">
          Viaje
          <button type="button" class="dudasViaje">
            <mat-icon>question_mark</mat-icon>
          </button>
        </span>
      </th>
      <td mat-cell *matCellDef="let element">
        <button mat-button type="button" class="btn btn_bg" (click)="crearViaje(element)">
          Crear viaje
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
