<ion-header class="ion-no-border">
    <ion-toolbar class="diseno">
        <ion-title>
            <div class="d-flex align-items-center">
                <div class="maricar-chat-avatar me-2">
                    <ion-icon name="car-sport-outline" class="chat-car"></ion-icon>
                    <ion-icon name="sparkles" class="chat-sparkle"></ion-icon>
                </div>
                <div class="d-flex flex-column">
                    <span style="line-height: 1.2; font-weight: 600;">MariCar</span>
                    <small class="text-muted" style="font-size: 0.75rem; line-height: 1;">Tu asistente de viajes</small>
                </div>
            </div>
        </ion-title>
        <ion-buttons slot="end">
            <ion-button (click)="cerrarModal()" color="medium">
                <ion-icon name="close-outline" slot="icon-only"></ion-icon>
            </ion-button>
        </ion-buttons>
    </ion-toolbar>
</ion-header>

<ion-content class="ion-padding content">
    <div class="chat-container d-flex flex-column gap-3 py-2">
        <div *ngFor="let mensaje of mensajes" class="d-flex w-100"
            [ngClass]="mensaje.remitente === 'usuario' ? 'justify-content-end' : 'justify-content-start'">

            <!-- Mensaje de la IA -->
            <div *ngIf="mensaje.remitente === 'ia'" class="d-flex align-items-start gap-2 max-w-85">
                <div class="ia-avatar-bubble shadow-sm rounded-circle p-1 d-flex align-items-center justify-content-center"
                    style="min-width: 35px; height: 35px;">
                    <ion-icon name="sparkles" class="icon-sparkle-animado" style="font-size: 1.1rem;"></ion-icon>
                </div>
                <div class="mensaje-bubble ia-bubble p-3 shadow-sm rounded-4 bg-white text-dark">
                    <p class="mb-0" style="font-size: 0.95rem; line-height: 1.4;">{{ mensaje.texto }}</p>
                </div>
            </div>

            <!-- Mensaje del Usuario -->
            <div *ngIf="mensaje.remitente === 'usuario'"
                class="d-flex align-items-end gap-2 max-w-85 justify-content-end">
                <div class="mensaje-bubble usuario-bubble p-3 shadow-sm rounded-4 text-white">
                    <p class="mb-0" style="font-size: 0.95rem; line-height: 1.4;">{{ mensaje.texto }}</p>
                </div>
            </div>
        </div>

        <!-- Indicador de "Escribiendo..." mientras la IA responde -->
        <div *ngIf="cargandoIA && !creandoViajeEstado" class="d-flex align-items-center gap-2">
            <div class="ia-avatar-bubble shadow-sm rounded-circle p-1 d-flex align-items-center justify-content-center"
                style="width: 35px; height: 35px;">
                <ion-icon name="sparkles" class="icon-sparkle-animado" style="font-size: 1.1rem;"></ion-icon>
            </div>
            <div class="bg-white p-3 rounded-4 shadow-sm d-flex align-items-center gap-2">
                <ion-spinner name="dots" color="primary"></ion-spinner>
                <small class="text-muted fw-semibold">MariCar está pensando...</small>
            </div>
        </div>

        <!-- TARJETA VISUAL DE CREACIÓN DE VIAJE -->
        <div *ngIf="creandoViajeEstado"
            class="card-creando-viaje p-3 shadow-sm rounded-4 my-2 d-flex align-items-center gap-3"
            [ngClass]="viajeCreadoExito ? 'exito' : 'procesando'">

            <div class="icon-status-container d-flex align-items-center justify-content-center">
                <ion-spinner *ngIf="!viajeCreadoExito" name="crescent" color="primary"></ion-spinner>
                <ion-icon *ngIf="viajeCreadoExito" name="checkmark-circle-outline"
                    class="text-success display-6"></ion-icon>
            </div>

            <div class="d-flex flex-column flex-grow-1">
                <strong class="title-status" style="font-size: 0.95rem;">
                    {{ viajeCreadoExito ? '¡Viaje Publicado!' : 'Creando tu viaje...' }}
                </strong>
                <span class="text-muted" style="font-size: 0.85rem; line-height: 1.3;">
                    {{ mensajeCargaViaje }}
                </span>
            </div>
        </div>

    </div>
</ion-content>

<ion-footer class="ion-no-border diseno p-2 shadow-lg">
    <div class="d-flex align-items-center gap-2 px-2">
        <ion-item lines="none" class="flex-grow-1 bg-light rounded-pill custom-input-container">
            <ion-input [(ngModel)]="inputUsuario" (ionInput)="onInputUsuarioChange($event)"
                (keyup.enter)="enviarMensaje()" placeholder="Responde a MariCar..." clearInput="true"
                autocapitalize="sentences" [disabled]="creandoViajeEstado" style="font-size: 0.95rem;">
            </ion-input>
        </ion-item>
        <ion-button (click)="enviarMensaje()" shape="round" class="m-0 btn-enviar-maricar"
            [disabled]="!inputUsuario.trim() || creandoViajeEstado">
            <ion-icon name="send" slot="icon-only"></ion-icon>
        </ion-button>
    </div>
</ion-footer>
