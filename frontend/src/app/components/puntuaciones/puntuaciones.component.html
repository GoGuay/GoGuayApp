<div class="main">
  <h1 class="text-center">Puntúa el viaje que has realizado</h1>
  <mat-divider class="mb-2"></mat-divider>

  <form [formGroup]="puntuacionForm" (ngSubmit)="verificarEncuesta()">
    <div class="container text-center mt-4">
      <div class="row">
        <div class="container row">
          <h3>Esta puntuación es para {{ nombre_usuario }}</h3>
          <p>¿Cómo ha sido tu experiencia?</p>
          <div class="d-flex justify-content-center starsContainer">
            <img *ngFor="let estrella of estrellas; let i = index"
              src="{{ i < calificacionSeleccionada ? '../../../../../assets/rating/como.gif' : '../../../../../assets/rating/favorito.gif' }}"
              class="stars" type="button" (click)="seleccionarCalificacion(i + 1)">
          </div>
        </div>
      </div>
    </div>
  </form>


  <div class="container mt-4">
    <p>
      Puedes realizar la encuesta completa para que nosotros podamos mejorar.
      <br>
      No te robará mucho tiempo:
    </p>

    <p>
      <span>
        <i>👉 </i> <a href="/encuesta-satisfaccion"> Encuesta completa</a>
      </span>
    </p>

  </div>
  <div class="container text-end">
    <button mat-button type="button" class="btn_bg" (click)="puntuarViaje()">Puntuar viaje</button>
  </div>

</div>
