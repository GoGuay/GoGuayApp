<div
  id="contenedor_publicar_viaje"
  class="p-2"
>
  <ion-grid
    [fixed]="true"
    class="d-flex justify-content-center"
  >
    <ion-row>
      <ion-col>
        <div class="container">
          <img
            alt=""
            src="../../../assets/banco_imagenes/travel1.jpg"
            class="img_travel"
          />
        </div>
      </ion-col>
      <ion-col>
        <div class="container">
          <h2>{{ 'HOME.SECCION_BUSCAR.TITULO' | translate }}</h2>
          <div class="d-flex justify-content-center">
            <button
              type="button"
              mat-raised-button
              class="me-2 btn_bg travel-btn"
              (click)="openSearch()"
              [attr.aria-label]="'HOME.SECCION_BUSCAR.AYUDA' | translate"
              [title]="'HOME.SECCION_BUSCAR.AYUDA' | translate"
            >
              <img
                src="../../../assets/sistema/busqueda.png"
                class="travel-icon"
                alt=""
              />
              <span class="travel-text">
                {{ 'BOTON.BUSCA_TU_VIAJE_AQUI' | translate }}
              </span>
            </button>
          </div>
          <div class="d-flex justify-content-center">
            <span class="travel_span">
              {{ 'HOME.SECCION_BUSCAR.DESCRIPCION' | translate }}
            </span>
          </div>
        </div>
      </ion-col>
    </ion-row>
  </ion-grid>
</div>
