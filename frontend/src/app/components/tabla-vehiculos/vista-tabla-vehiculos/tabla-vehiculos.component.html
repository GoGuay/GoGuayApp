<div class="mb-5 container">
  <h4 class="text-center mb-1 mb-sm-1 mb-md-5">
    {{ 'TABLA_VEHICULOS.TITULO' | translate }}
  </h4>
  <div class="contenedor_seccion">
    <div class="contenedor_inputs">
      <ng-container
        *ngIf="vehiculos && vehiculos.length > 0; else sinVehiculos"
      >
        <!-- MODO SELECCIÓN (Crear Viaje) -->
        <ng-container *ngIf="modoSeleccion; else modoPerfil">
          <ion-list
            class="scrollable-list custom-goguay-list"
            lines="none"
          >
            <ion-radio-group
              [(ngModel)]="cocheSeleccionado"
              [compareWith]="compareVehiculos"
              (ionChange)="seleccionarCoche(cocheSeleccionado)"
            >
              <ion-item
                *ngFor="let coche of vehiculos; trackBy: trackByVehiculo"
                (click)="seleccionarCoche(coche)"
                class="goguay-list-item"
              >
                <ion-label class="d-flex align-items-center">
                  <div class="car-icon-wrapper me-3">
                    <img
                      class="colorCoche"
                      [src]="mostrarColorCoche(coche.color)"
                      alt="Color vehículo"
                    />
                  </div>
                  <span class="car-info-text">
                    {{ coche.marca }} {{ coche.modelo }}
                  </span>
                </ion-label>
                <ion-radio
                  slot="end"
                  [value]="coche"
                  mode="ios"
                ></ion-radio>
              </ion-item>
            </ion-radio-group>
          </ion-list>

          <div
            class="d-flex flex-column align-items-center mt-3 alternate-add-box"
          >
            <p class="mb-2 text-muted small">
              {{ 'TABLA_VEHICULOS.ANADIR_OTRO' | translate }}
            </p>
            <button
              type="button"
              class="btn-goguay-mini"
              (click)="irARegistrarVehiculo.emit()"
            >
              <i class="fi fi-rr-plus me-1"></i>
              Añadir vehículo
            </button>
          </div>
        </ng-container>

        <!-- MODO PERFIL (Mi Perfil: con Editar, Eliminar y botón de añadir) -->
        <ng-template #modoPerfil>
          <ion-list
            class="scrollable-list custom-goguay-list"
            lines="none"
          >
            <ion-item
              *ngFor="let coche of vehiculos; trackBy: trackByVehiculo"
              class="goguay-list-item"
            >
              <ion-label class="d-flex align-items-center">
                <div class="car-icon-wrapper me-3">
                  <img
                    class="colorCoche"
                    [src]="mostrarColorCoche(coche.color)"
                    [alt]="
                      'TABLA_VEHICULOS.SELECTOR.COLOR'
                        | translate: { color: coche.color }
                    "
                  />
                </div>
                <span class="car-info-text">
                  {{ coche.marca }} {{ coche.modelo }}
                </span>
              </ion-label>

              <!-- Botones de Editar y Eliminar (Solo en Mi Perfil) -->
              <div
                class="d-flex align-items-center gap-2"
                slot="end"
              >
                <button
                  mat-icon-button
                  class="botones_tabla btn_bg"
                  [attr.aria-label]="
                    'TABLA_VEHICULOS.BOTÓN_EDITAR_HELP'
                      | translate
                        : {
                            marca: coche.marca,
                            modelo: coche.modelo,
                            color: coche.color,
                          }
                  "
                  (click)="
                    editarFilaVehiculo(coche);
                    editarVehiculo.emit(coche);
                    $event.stopPropagation()
                  "
                >
                  <mat-icon>edit</mat-icon>
                </button>
                <button
                  mat-icon-button
                  [attr.aria-label]="
                    'TABLA_VEHICULOS.BOTON_ELIMINAR_HELP'
                      | translate
                        : {
                            marca: coche.marca,
                            modelo: coche.modelo,
                            color: coche.color,
                          }
                  "
                  class="botones_tabla btn_bg"
                  (click)="
                    eliminarVehiculo.emit(coche); $event.stopPropagation()
                  "
                >
                  <mat-icon>delete</mat-icon>
                </button>
              </div>
            </ion-item>
          </ion-list>

          <!-- Botón de añadir vehículo también visible en Mi Perfil -->
          <div
            class="d-flex flex-column align-items-center mt-3 alternate-add-box"
          >
            <button
              type="button"
              class="btn-goguay-mini"
              (click)="irARegistrarVehiculo.emit()"
            >
              <i class="fi fi-rr-plus me-1"></i>
              {{ 'TABLA_VEHICULOS.BTN_ANADIR_VEHICULO' | translate }}
            </button>
          </div>
        </ng-template>
      </ng-container>

      <ng-template #sinVehiculos>
        <div
          class="mensaje-sin-vehiculos p-3 text-center card shadow-sm rounded-3"
        >
          <p class="text-muted">
            {{ 'TABLA_VEHICULOS.SIN_VEHICULOS' | translate }}
          </p>
          <div class="mt-3">
            <button
              type="button"
              class="btn-goguay-mini"
              (click)="irARegistrarVehiculo.emit()"
            >
              <i class="fi fi-rr-plus me-1"></i>
              {{ 'TABLA_VEHICULOS.BTN_ANADIR_VEHICULO' | translate }}
            </button>
          </div>
        </div>
        <!--Selector de marca, modelo y color de vehiculos y botón para guardar vehiculo-->
      </ng-template>
      <div
        class="mt-3 d-flex justify-content-center"
        *ngIf="mostrarSelectorVehiculo"
      >
        <div class="bloque-selectores">
          <div class="row d-flex justify-content-center">
            <!-- Selector de marca -->
            <div class="col-12 col-md-3 mb-2 mb-md-0">
              <select
                class="form-select"
                [(ngModel)]="marcaSeleccionada"
                (change)="filtrarModelos()"
                [ngModelOptions]="{ standalone: true }"
                [attr.aria-label]="
                  'TABLA_VEHICULOS.SELECTOR.AYUDA_MARCA' | translate
                "
              >
                <option
                  value=""
                  disabled
                  selected
                >
                  {{ 'TABLA_VEHICULOS.SELECTOR.MARCA' | translate }}
                </option>
                <option
                  *ngFor="let coche of listadoCoches"
                  [value]="coche.marca"
                >
                  {{ coche.marca }}
                </option>
              </select>
            </div>

            <!-- Selector de modelo -->
            <div class="col-12 col-md-3 mb-2 mb-md-0">
              <select
                class="form-select"
                [(ngModel)]="modeloSeleccionado"
                [disabled]="!marcaSeleccionada"
                [ngModelOptions]="{ standalone: true }"
                [attr.aria-label]="
                  'TABLA_VEHICULOS.SELECTOR.AYUDA_MODELO' | translate
                "
              >
                <option
                  value=""
                  disabled
                  selected
                >
                  {{ 'TABLA_VEHICULOS.SELECTOR.MODELO' | translate }}
                </option>

                <option
                  *ngFor="let modelo of modelosFiltrados"
                  [value]="modelo"
                >
                  {{ modelo }}
                </option>
              </select>
            </div>

            <!-- Selector de color -->
            <div class="col-12 col-md-3 mb-2 mb-md-0">
              <div *ngIf="funcionesComunes.validacionIdioma">
                <select
                  class="form-select"
                  [(ngModel)]="colorSeleccionado"
                  [ngModelOptions]="{ standalone: true }"
                  [disabled]="!modeloSeleccionado"
                  [attr.aria-label]="
                    'TABLA_VEHICULOS.SELECTOR.AYUDA_COLOR' | translate
                  "
                >
                  <option
                    value=""
                    disabled
                    selected
                  >
                    {{ 'TABLA_VEHICULOS.SELECTOR.MODELO' | translate }}
                  </option>
                  <option
                    *ngFor="let color of listadoColores"
                    [value]="color"
                  >
                    {{ color }}
                  </option>
                </select>
              </div>

              <div *ngIf="!funcionesComunes.validacionIdioma">
                <select
                  class="form-select inputs_selectores"
                  aria-label="Selección de color"
                  [(ngModel)]="colorSeleccionado"
                  [ngModelOptions]="{ standalone: true }"
                  [disabled]="!modeloSeleccionado"
                >
                  <option
                    value=""
                    disabled
                    selected
                  >
                    {{ 'TABLA_VEHICULOS.SELECTOR.COLOR' | translate }}
                  </option>
                  <option
                    *ngFor="let color of listColours"
                    [value]="color"
                  >
                    {{ color }}
                  </option>
                </select>
              </div>
            </div>
          </div>
          <ion-row>
            <div
              *ngIf="!editandoCoche"
              class="container d-flex justify-content-center mt-2"
            >
              <button
                type="button"
                [disabled]="
                  !marcaSeleccionada ||
                  !modeloSeleccionado ||
                  !colorSeleccionado
                "
                class="btn btn_bg"
                mat-raised-button
                (click)="guardarVehiculo()"
              >
                {{ 'BOTON.GUARDAR_VEHICULO' | translate }}
              </button>
            </div>
            <div
              *ngIf="editandoCoche"
              class="container d-flex justify-content-center mt-2"
            >
              <button
                type="button"
                [disabled]="
                  !marcaSeleccionada ||
                  !modeloSeleccionado ||
                  !colorSeleccionado
                "
                class="btn btn_bg"
                mat-raised-button
                (click)="guardarVehiculoEditado(cocheEnEdicion)"
              >
                {{ 'BOTON.GUARDAR_VEHICULO' | translate }}
              </button>
            </div>
          </ion-row>
        </div>
      </div>
    </div>
  </div>
