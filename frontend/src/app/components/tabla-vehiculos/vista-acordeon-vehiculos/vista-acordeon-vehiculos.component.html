<div class="mb-5 container">
  <h4 class="text-center mb-1 mb-sm-1 mb-md-5">
    {{ "MI_PERFIL.MIS_VEHICULOS" | translate }}
  </h4>

  <div class="acordeones_vehiculos">
    <div class="mt-3" *ngFor="let coche of funcionesUsuario.vehiculos_usuario">
      <mat-accordion multi>
        <mat-expansion-panel>
          <mat-expansion-panel-header>
            <mat-panel-title>
              {{ coche.marca }} {{ coche.modelo }}
            </mat-panel-title>
          </mat-expansion-panel-header>

          <ion-row class="d-flex justify-content-center mb-2">
            <div>
              <ng-container *ngIf="coche.editandoVehiculo; else noEditMarca">
                <select
                  class="form-select"
                  [(ngModel)]="coche.marca"
                  (change)="filtrarModelosEditando(coche)"
                >
                  <option
                    *ngFor="let coche of listadoCoches"
                    [value]="coche.marca"
                  >
                    {{ coche.marca }}
                  </option>
                </select>
              </ng-container>

              <ng-template #noEditMarca>{{ coche.marca }}</ng-template>
              <ng-container *ngIf="coche.editandoVehiculo; else noEditModelo">
                <select class="form-select" [(ngModel)]="coche.modelo">
                  <option
                    *ngFor="let modelo of modelosFiltrados"
                    [value]="modelo"
                  >
                    {{ modelo }}
                  </option>
                </select>
              </ng-container>
              <ng-template #noEditModelo>{{ coche.modelo }}</ng-template>
            </div>
          </ion-row>

          <ion-row class="mb-2">
            <ion-col class="d-flex justify-content-center">
              <ng-container *ngIf="coche.editandoVehiculo; else noEditColor">
                <select class="form-select" [(ngModel)]="coche.color">
                  <option *ngFor="let color of listadoColores" [value]="color">
                    {{ color }}
                  </option>
                </select>
              </ng-container>
              <ng-template #noEditColor>
                <img
                  class="colorCoche"
                  [src]="mostrarColorCoche(coche.color)"
                />
              </ng-template>
            </ion-col>
            <ion-col>
              <ng-container
                *ngIf="coche.editandoVehiculo; else noEditMatricula"
              >
                <input
                  type="text"
                  [(ngModel)]="coche.matricula"
                  class="form-control"
                />
              </ng-container>
              <ng-template #noEditMatricula>{{ coche.matricula }}</ng-template>
            </ion-col>
          </ion-row>

          <div class="d-flex justify-content-center">
            <button
              class="botones_tabla btn_bg me-3"
              mat-icon-button
              (click)="
                coche.editandoVehiculo
                  ? guardarVehiculoEditado(coche)
                  : editarFilaVehiculo(coche)
              "
            >
              <mat-icon>{{
                coche.editandoVehiculo ? "save" : "edit"
              }}</mat-icon>
            </button>
            <button
              class="botones_tabla btn_bg"
              mat-icon-button
              (click)="modalEliminarVehiculo(coche)"
            >
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </mat-expansion-panel>
      </mat-accordion>
    </div>
  </div>

  <ng-template #noVehiculos>
    <div class="mt-3 d-flex justify-content-center">
      <span>No tienes vehículos añadidos</span>
    </div>
  </ng-template>

  <div class="d-flex justify-content-center">
    <button
      type="button"
      class="btn btn_bg mt-3 boton_anadir"
      style="height: 33px"
      (click)="botonAnadirVehiculo()"
    >
      {{ "BOTON.ANADIR_VEHICULO" | translate }}
    </button>
  </div>

  <div class="mt-3" *ngIf="mostrarSelectorVehiculo">
    <ion-grid>
      <ion-row>
        <ion-col size="6">
          <select
            class="form-select"
            [(ngModel)]="marcaSeleccionada"
            (change)="filtrarModelos()"
            [ngModelOptions]="{ standalone: true }"
            aria-label="Selección de marca"
          >
            <option value="" disabled selected>
              {{ "VEHICULOS.MARCA" | translate }}
            </option>
            <option *ngFor="let coche of listadoCoches" [value]="coche.marca">
              {{ coche.marca }}
            </option>
          </select>
        </ion-col>
        <ion-col size="6">
          <select
            class="form-select"
            [(ngModel)]="modeloSeleccionado"
            [disabled]="!marcaSeleccionada"
            [ngModelOptions]="{ standalone: true }"
            aria-label="Selección de modelo"
          >
            <option value="" disabled selected>
              {{ "VEHICULOS.MODELO" | translate }}
            </option>
            <option *ngFor="let modelo of modelosFiltrados" [value]="modelo">
              {{ modelo }}
            </option>
          </select>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="6">
          <div *ngIf="funcionesComunes.validacionIdioma">
            <select
              class="form-select"
              aria-label="Selección de color"
              [(ngModel)]="colorSeleccionado"
              [ngModelOptions]="{ standalone: true }"
              [disabled]="!modeloSeleccionado"
            >
              <option value="" disabled selected>
                {{ "VEHICULOS.COLOR" | translate }}
              </option>
              <option *ngFor="let color of listadoColores" [value]="color">
                {{ color }}
              </option>
            </select>
          </div>

          <div *ngIf="!funcionesComunes.validacionIdioma">
            <select
              class="form-select"
              aria-label="Selección de color"
              [(ngModel)]="colorSeleccionado"
              [ngModelOptions]="{ standalone: true }"
              [disabled]="!modeloSeleccionado"
            >
              <option value="" disabled selected>
                {{ "VEHICULOS.COLOR" | translate }}
              </option>
              <option *ngFor="let color of listColours" [value]="color">
                {{ color }}
              </option>
            </select>
          </div>
        </ion-col>
        <ion-col size="6">
          <div class="position-relative text-center">
            <input
              type="text"
              class="form-control-sm"
              placeholder="0000XXX"
              id="matricula"
              pattern="^[0-9]{4}[A-Za-z]{3}$"
              required
              maxlength="7"
              aria-describedby="matricula"
              [(ngModel)]="matricula"
              (ngModelChange)="validarMatricula()"
              style="width: 120px"
            />

            <div>
              <div *ngIf="matriculaNoValida" class="text-danger">
                Matrícula inválida. Debe tener 4 números seguidos de 3 letras
                (Ej: 1234ABC).
              </div>
            </div>
          </div>
        </ion-col>
      </ion-row>

      <ion-row class="d-flex justify-content-center"> </ion-row>
      <ion-row>
        <div class="container d-flex justify-content-center mt-2">
          <button
            type="button"
            [disabled]="matriculaNoValida"
            class="btn btn_bg"
            mat-raised-button
            (click)="guardarVehiculo()"
          >
            Guardar vehículo
          </button>
        </div>
      </ion-row>
    </ion-grid>
  </div>
</div>
