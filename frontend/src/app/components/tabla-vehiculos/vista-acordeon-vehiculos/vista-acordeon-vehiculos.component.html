<div class="mb-5 container">
  <h4 class="text-center mb-1 mb-sm-1 mb-md-5">
    {{ "MI_PERFIL.MIS_VEHICULOS" | translate }}
  </h4>

  <!-- Acordeones coches del usuario para vista móvil -->
  <div class="acordeones_vehiculos">
    <div class="mt-3" *ngFor="let coche of funcionesUsuario.vehiculos_usuario">
      <mat-accordion multi>
        <mat-expansion-panel>
          <mat-expansion-panel-header>
            <!-- Cabeza del acordeon: marca y modelo  -->
            <mat-panel-title>
              {{ coche.marca }} {{ coche.modelo }}
            </mat-panel-title>
          </mat-expansion-panel-header>
          <!-- Contenido: marca y modelo -->
          <ion-row class="d-flex justify-content-center mb-2">
            <div>
              <ng-container *ngIf="coche.editandoVehiculo; else noEditMarca">
                <select
                  class="form-select"
                  [(ngModel)]="coche.marca"
                  (change)="funcionesUsuario.filtrarModelosEditando(coche)"
                >
                  <option
                    *ngFor="let coche of funcionesComunes.listadoCoches"
                    [value]="coche.marca"
                  >
                    {{ coche.marca }}
                  </option>
                </select>
              </ng-container>

              <ng-template #noEditMarca>{{ coche.marca }}</ng-template>
              <ng-container *ngIf="coche.editandoVehiculo; else noEditModelo">
                <select class="form-select" [(ngModel)]="coche.modelo">
                  <option
                    *ngFor="let modelo of funcionesComunes.modelosFiltrados"
                    [value]="modelo"
                  >
                    {{ modelo }}
                  </option>
                </select>
              </ng-container>
              <ng-template #noEditModelo>{{ coche.modelo }}</ng-template>
            </div>
          </ion-row>
          <!-- Contenido: color y matrícula -->
          <ion-row class="mb-2">
            <ion-col class="d-flex justify-content-center">
              <ng-container *ngIf="coche.editandoVehiculo; else noEditColor">
                <select class="form-select" [(ngModel)]="coche.color">
                  <option
                    *ngFor="let color of funcionesComunes.listadoColores"
                    [value]="color"
                  >
                    {{ color }}
                  </option>
                </select>
              </ng-container>
              <ng-template #noEditColor>
                <img
                  class="colorCoche"
                  [src]="funcionesComunes.mostrarColorCoche(coche.color)"
                />
              </ng-template>
            </ion-col>
            <ion-col>
              <ng-container
                *ngIf="coche.editandoVehiculo; else noEditMatricula"
              >
                <input
                  type="text"
                  [(ngModel)]="coche.matricula"
                  class="form-control"
                />
              </ng-container>
              <ng-template #noEditMatricula>{{ coche.matricula }}</ng-template>
            </ion-col>
          </ion-row>
          <!-- Botones: editar y eliminar vehículo -->
          <div class="d-flex justify-content-center">
            <button
              class="botones_tabla btn_bg me-3"
              mat-icon-button
              (click)="
                coche.editandoVehiculo
                  ? funcionesUsuario.guardarVehiculoEditado(coche)
                  : funcionesUsuario.editarFilaVehiculo(coche)
              "
            >
              <mat-icon>{{
                coche.editandoVehiculo ? "save" : "edit"
              }}</mat-icon>
            </button>
            <button
              class="botones_tabla btn_bg"
              mat-icon-button
              (click)="funcionesUsuario.modalEliminarVehiculo(coche)"
            >
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </mat-expansion-panel>
      </mat-accordion>
    </div>
  </div>
  <!--Mensaje si no hay ningún vehículo añadido-->
  <ng-template #noVehiculos>
    <div class="mt-3 d-flex justify-content-center">
      <span>No tienes vehículos añadidos</span>
    </div>
  </ng-template>

  <!-- Boton para añadir vehiculos -->
  <div class="d-flex justify-content-center">
    <button
      type="button"
      class="btn btn_bg mt-3 boton_anadir"
      style="height: 33px"
      (click)="funcionesComunes.botonAnadirVehiculo()"
    >
      {{ "BOTON.ANADIR_VEHICULO" | translate }}
    </button>
  </div>

  <!--Selector de marca, modelo y color de vehiculos y botón para guardar vehiculo-->
  <div class="mt-3" *ngIf="funcionesComunes.mostrarSelectorVehiculo">
    <ion-grid>
      <ion-row>
        <ion-col size="4">
          <select
            class="form-select"
            [(ngModel)]="funcionesComunes.marcaSeleccionada"
            (change)="funcionesComunes.filtrarModelos()"
            [ngModelOptions]="{ standalone: true }"
            aria-label="Selección de marca"
          >
            <option value="" disabled selected>
              {{ "VEHICULOS.MARCA" | translate }}
            </option>
            <option
              *ngFor="let coche of funcionesComunes.listadoCoches"
              [value]="coche.marca"
            >
              {{ coche.marca }}
            </option>
          </select>
        </ion-col>
        <ion-col size="4">
          <select
            class="form-select"
            [(ngModel)]="funcionesComunes.modeloSeleccionado"
            [disabled]="!funcionesComunes.marcaSeleccionada"
            [ngModelOptions]="{ standalone: true }"
            aria-label="Selección de modelo"
          >
            <option value="" disabled selected>
              {{ "VEHICULOS.MODELO" | translate }}
            </option>
            <option
              *ngFor="let modelo of funcionesComunes.modelosFiltrados"
              [value]="modelo"
            >
              {{ modelo }}
            </option>
          </select>
        </ion-col>
        <ion-col size="4">
          <div *ngIf="funcionesComunes.validacionIdioma">
            <select
              class="form-select"
              aria-label="Selección de color"
              [(ngModel)]="funcionesComunes.colorSeleccionado"
              [ngModelOptions]="{ standalone: true }"
              [disabled]="!funcionesComunes.modeloSeleccionado"
            >
              <option value="" disabled selected>
                {{ "VEHICULOS.COLOR" | translate }}
              </option>
              <option
                *ngFor="let color of funcionesComunes.listadoColores"
                [value]="color"
              >
                {{ color }}
              </option>
            </select>
          </div>

          <div *ngIf="!funcionesComunes.validacionIdioma">
            <select
              class="form-select"
              aria-label="Selección de color"
              [(ngModel)]="funcionesComunes.colorSeleccionado"
              [ngModelOptions]="{ standalone: true }"
              [disabled]="!funcionesComunes.modeloSeleccionado"
            >
              <option value="" disabled selected>
                {{ "VEHICULOS.COLOR" | translate }}
              </option>
              <option
                *ngFor="let color of funcionesComunes.listColours"
                [value]="color"
              >
                {{ color }}
              </option>
            </select>
          </div>
        </ion-col>
      </ion-row>
      <ion-row class="d-flex justify-content-center">
        <div class="position-relative text-center">
          <input
            type="text"
            class="form-control-sm"
            placeholder="0000XXX"
            id="matricula"
            pattern="^[0-9]{4}[A-Za-z]{3}$"
            required
            maxlength="7"
            aria-describedby="matricula"
            [(ngModel)]="funcionesComunes.matricula"
            (ngModelChange)="funcionesComunes.validarMatricula()"
            style="width: 120px"
          />

          <!-- Mensaje de error -->
          <div>
            <div *ngIf="funcionesComunes.matriculaNoValida" class="text-danger">
              Matrícula inválida. Debe tener 4 números seguidos de 3 letras (Ej:
              1234ABC).
            </div>
          </div>
        </div>
      </ion-row>
      <ion-row>
        <div class="container d-flex justify-content-center mt-2">
          <button
            type="button"
            [disabled]="funcionesComunes.matriculaNoValida"
            class="btn btn_bg"
            mat-raised-button
            (click)="funcionesUsuario.guardarVehiculo()"
          >
            Guardar vehículo
          </button>
        </div>
      </ion-row>
    </ion-grid>
  </div>
</div>
