<div class="container" @dialogAnimation>
  <div class="modal-header d-flex align-items-center">
    <div class="d-flex align-items-center">
      <mat-icon class="icon-red">question_mark</mat-icon>
      <h2 class="ms-2">{{ data.title }}</h2>
    </div>
    <button mat-icon-button class="close-button" (click)="close()" aria-label="Cerrar">
      <mat-icon>close</mat-icon>
    </button>


  </div>
  <mat-divider></mat-divider>
  <div class="modal-body">
    <p [innerHTML]="message"></p>
    <div class="button-container" *ngIf="data.showMoreInfoButton">
      <button mat-raised-button class="btn_bg" (click)="abrirMasDetalles()">
        Ver más detalles <mat-icon>info</mat-icon>
      </button>
    </div>
  </div>
  <div class="modal-footer d-flex justify-content-center">
    <button mat-button (click)="close()" class="me-2" *ngIf="!data.showMoreInfoButton">
      Cerrar
    </button>
    <button mat-raised-button color="primary" class="me-2" (click)="crearVuelta()" *ngIf="data.showReturnTripButton">
      Crear viaje de vuelta
    </button>
    <button mat-button class="btn_bg" (click)="aceptarCondiciones('registro')" *ngIf="data.showAcceptButton"
      cdkFocusInitial>
      Aceptar
    </button>
    <button mat-button (click)="cerrarParaMasInfo('home')" *ngIf="data.showMoreInfoButton">
      No aceptar
    </button>
  </div>
</div>
