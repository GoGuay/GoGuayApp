<app-navbar
  [backRoute]="'/home'"
  [searchRoute]="'newTravel'"
  [isLoggedIn]="userLoggedIn"
></app-navbar>

<ion-content [fullscreen]="true">
  <div *ngIf="mostrarJumbotron">
    <app-jumbotron
      [title]="'JUMBOTRON.BUSCAR_VIAJE_SLOGAN' | translate"
      [imageSrc]="'../../assets/folder/jumbo.jpg'"
      [helpText]="'JUMBOTRON.HELP'"
    ></app-jumbotron>
  </div>
  <div class="mt-3 container-fluid">
    <div class="buscador_box mb-3">
      <div class="seeker">
        <app-buscador (onSearch)="actualizarParametrosBusqueda($event)"></app-buscador>
      </div>
    </div>

    <app-resultados-busqueda
      [paramsBusqueda]="busquedaParams"
      [filtroOrden]="filtroSeleccionado"
    ></app-resultados-busqueda>
  </div>
  <div class="d-flex justify-content-start mb-2 ms-2">
    <button
      type="button"
      class="btn btn-sm btn-outline-warning d-flex align-items-center gap-1 shadow-sm rounded-pill px-3"
      (click)="abrirIncidenciaBusqueda()"
    >
      <i class="fi fi-rr-info me-1"></i>
      <span>¿Problemas buscando un viaje? Reportar incidencia</span>
    </button>
  </div>
</ion-content>
