<app-navbar [backRoute]="'/home'" [searchRoute]="'newTravel'" [isLoggedIn]="userLoggedIn"></app-navbar>

<ion-content [fullscreen]="true">
  <div *ngIf="mostrarJumbotron">
    <app-jumbotron [title]="'JUMBOTRON.BUSCAR_VIAJE_SLOGAN' | translate" [imageSrc]="'../../assets/folder/jumbo.jpg'"
      [helpText]="'JUMBOTRON.HELP'">
    </app-jumbotron>
  </div>
  <div class="mt-3 container-fluid">
    <div class="buscador_box mb-3">
      <div class="seeker">
        <app-buscador (onSearch)="actualizarParametrosBusqueda($event)"></app-buscador>
      </div>
    </div>

    <ion-grid>
      <ion-row>
        <ion-col size="12" size-md="4" size-lg="2" class="ion-text-start" *ngIf="tieneParametros()">
          <ion-button id="open-filter" fill="outline" color="dark" class="btn-filtro-principal">
            <i class="fi fi-rr-settings-sliders me-2"></i>
            {{ 'BUSQUEDA.FILTRAR_POR' | translate }}
          </ion-button>

          <ion-popover #filtroPopover trigger="open-filter" triggerAction="click" mode="ios">
            <ng-template>
              <ion-content class="ion-padding">
                <ion-list lines="none">
                  <ion-radio-group [value]="filtroSeleccionado" (ionChange)="onFiltroChange($event, filtroPopover)">
                    <ion-item>
                      <ion-label>{{ 'BUSQUEDA.HORA_SALIDA' | translate }}</ion-label>
                      <ion-radio value="horaSalida"></ion-radio>
                    </ion-item>
                    <ion-item>
                      <ion-label>{{ 'BUSQUEDA.NUEVO' | translate }}</ion-label>
                      <ion-radio value="recientes"></ion-radio>
                    </ion-item>
                    <ion-item>
                      <ion-label>{{ 'BUSQUEDA.PRECIO_ASC' | translate }}</ion-label>
                      <ion-radio value="precioAsc"></ion-radio>
                    </ion-item>
                    <ion-item>
                      <ion-label>{{ 'BUSQUEDA.PRECIO_DESC' | translate }}</ion-label>
                      <ion-radio value="precioDesc"></ion-radio>
                    </ion-item>
                  </ion-radio-group>
                </ion-list>
              </ion-content>
            </ng-template>
          </ion-popover>
        </ion-col>

        <ion-col size="12" size-md="8" size-lg="10">
          <app-resultados-busqueda [paramsBusqueda]="busquedaParams" [filtroOrden]="filtroSeleccionado">
          </app-resultados-busqueda>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
