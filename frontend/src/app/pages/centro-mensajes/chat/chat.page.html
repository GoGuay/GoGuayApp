<ion-header>
    <app-navbar [backRoute]="'/centro-mensajes'"></app-navbar>
</ion-header>

<ion-content>
    <ion-fab vertical="bottom" horizontal="start" slot="fixed" class="fab-atras" title="Volver atrás">
        <ion-fab-button aria-label="Buscar viaje" (click)="goBack()">
            <img [src]="irAtrasImg" alt="Buscar viaje" style="width: 24px; height: 24px;">
        </ion-fab-button>
    </ion-fab>

    <div *ngFor="let m of mensajes" [class.mio]="m.emisor == userId" class="mensaje">
        {{ m.contenido }}
    </div>
</ion-content>

<ion-footer>
    <div class="input-wrapper">
        <ion-textarea
            [(ngModel)]="texto"
            placeholder="Escribe un mensaje"
            autoGrow="true"
            class="chat-textarea"
        ></ion-textarea>

        <ion-button (click)="enviar()">Enviar</ion-button>
    </div>
</ion-footer>
