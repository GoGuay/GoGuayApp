<app-navbar [backRoute]="'/home'" [searchRoute]="'search'" [isLoggedIn]="userLoggedIn"></app-navbar>

<ion-content [fullscreen]="true">
  <div class="container">
    <h1 class="text-center"><strong>FORMULARIO DE CONTACTO.</strong></h1>
    <mat-divider></mat-divider>
    <div class="container mt-3">
      <div class="d-flex align-items-center justify-content-center">
        <div class="infoText ">
          <p>
            Rellena los siguientes campos para poder ponerte en contacto con nosotros.
            <br>
            Intentaremos responder a la mayor brevedad.
          </p>
        </div>
      </div>


      <form class="mt-3">
        <div class="mb-3">
          <label for="nombreContacto" class="form-label">Nombre de contacto</label>
          <input type="text" class="form-control inputContact" id="nombreContacto" placeholder="Nombre de contacto.">
        </div>
        <div class="mb-3">
          <label for="emailContacto" class="form-label">Email de contacto</label>
          <input type="email" class="form-control inputContact" id="emailContacto" placeholder="name@example.com">
        </div>
        <div class="mb-3">
          <label for="asunto" class="form-label">Asunto</label>
          <input type="email" class="form-control inputContact" id="asunto" placeholder="Asunto del mensaje.">
        </div>
        <div class="mb-3">
          <label for="contenidoMensaje" class="form-label">Mensaje.</label>
          <textarea class="form-control inputContact" id="contenidoMensaje" rows="3" placeholder="Escribe aquí tu mensaje. Por favor, cuida tu lenguaje. 🤗"></textarea>
        </div>
      </form>
    </div>

    <div class="d-flex justify-content-end">
      <button mat-raised-button class="btn_bg">Enviar</button>
    </div>
  </div>
</ion-content>
