<app-navbar
  [backRoute]="'/home'"
  [searchRoute]="'search'"
  [isLoggedIn]="userLoggedIn"
></app-navbar>

<ion-content [fullscreen]="true">
  <div class="container-fluid">
    <ion-row>
      <ion-col>
        <h4 class="text-center">{{'MI_PERFIL.INFO_PERSONAL' | translate}}</h4>
        <ion-row class="fila-datos">
          <ion-col class="col-nombre-apellidos">
            <div class="mb-3">
              <label for="nombre" class="form-label"
                >{{'MI_PERFIL.NOMBRE' | translate}}</label
              >
              <input
                type="text"
                class="form-control w-100"
                id="nombre"
                [(ngModel)]="funcionesUsuario.nombreEditado"
                name="nombre"
              />
            </div>
            <div class="mb-3">
              <label for="apellidos" class="form-label"
                >{{'MI_PERFIL.APELLIDOS' | translate}}</label
              >
              <input
                type="text"
                class="form-control"
                id="apellidos"
                [(ngModel)]="funcionesUsuario.apellidosEditados"
                name="apellidos"
              />
            </div>
          </ion-col>

          <ion-col class="col-pronombre">
            <div class="mb-3">
              <label for="pronombre" class="form-label pronombre"
                >{{'MI_PERFIL.PRONOMBRE' | translate}}</label
              >
              <select
                class="form-select w-150"
                [(ngModel)]="funcionesUsuario.pronombreEditado"
                name="pronombre"
              >
                <option selected disabled>Escoge una opcion</option>
                <option value="Él / He / Him">Él / He / Him</option>
                <option value="Ella / She / Her">Ella / She / Her</option>
                <option value="Elle / They / Them">Elle / They / Them</option>
                <option value="Otros">Otros</option>
                <option value="No uso ninguno concreto">
                  No uso ninguno concreto
                </option>
                <option value="Prefiero no responder">
                  Prefiero no responder
                </option>
              </select>
            </div>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <div class="mb-3">
              <label for="genero" class="form-label">
                {{'MI_PERFIL.GENERO' | translate}}
                <span
                  class="ms-2 text-primary"
                  data-bs-toggle="tooltip"
                  data-bs-placement="top"
                  title="Más detalles"
                >
                  <i class="bi-question-circle"></i>
                </span>
              </label>

              <select
                id="genero"
                class="form-select"
                [(ngModel)]="funcionesUsuario.generoEditado"
                name="genero"
                aria-label="Selección de género"
              >
                <option value="" selected disabled>
                  {{'SELEC_GENERO.SELECCIONA' | translate}}
                </option>
                <option value="HOMBRE_CIS">
                  {{'SELEC_GENERO.HOMBRE_CIS' | translate}}
                </option>
                <option value="MUJER_CIS">
                  {{'SELEC_GENERO.MUJER_CIS' | translate}}
                </option>
                <option value="TRANSEXUAL">
                  {{'SELEC_GENERO.TRANSEXUAL' | translate}}
                </option>
                <option value="NO_BINARIO">
                  {{'SELEC_GENERO.NO_BINARIO' | translate}}
                </option>
                <option value="INTERGENERO">
                  {{'SELEC_GENERO.INTERGENERO' | translate}}
                </option>
                <option value="NO_FLUIDO">
                  {{'SELEC_GENERO.NO_FLUIDO' | translate}}
                </option>
                <option value="OTRO">
                  {{'SELEC_GENERO.OTRO' | translate}}
                </option>
                <option value="NO_RESPONDE">
                  {{'SELEC_GENERO.NO_RESPONDE' | translate}}
                </option>
              </select>
            </div>
          </ion-col>
          <ion-col>
            <div class="mb-3">
              <label for="orientacion" class="form-label"
                >{{'MI_PERFIL.ORIENTACION' | translate}}
                <span
                  class="ms-2 text-primary"
                  data-bs-toggle="tooltip"
                  data-bs-placement="top"
                  title="Más detalles"
                >
                  <i class="bi-question-circle"></i>
                </span>
              </label>
              <select
                [(ngModel)]="funcionesUsuario.orientacionEditada"
                name="orientacion"
                class="form-select"
                aria-label="Selección de orientación sexual"
              >
                >
                <option selected>
                  {{'ORIENTACION.SELECCIONA' | translate}}
                </option>
                <option value="GAY">{{'ORIENTACION.GAY' | translate}}</option>
                <option value="LESBIANA">
                  {{'ORIENTACION.LESBIANA' | translate}}
                </option>
                <option value="BISEXUAL">
                  {{'ORIENTACION.BISEXUAL' | translate}}
                </option>
                <option value="PANSEXUAL">
                  {{'ORIENTACION.PANSEXUAL' | translate}}
                </option>
                <option value="ASEXUAL">
                  {{'ORIENTACION.ASEXUAL' | translate}}
                </option>
                <option value="DEMISEXUAL">
                  {{'ORIENTACION.DEMISEXUAL' | translate}}
                </option>
                <option value="QUEER">
                  {{'ORIENTACION.QUEER' | translate}}
                </option>
                <option value="OTRO">{{'ORIENTACION.OTRO' | translate}}</option>
                <option value="NO_RESPONDE">
                  {{'ORIENTACION.NO_RESPONDE' | translate}}
                </option>
              </select>
            </div>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <div class="mb-3">
              <label for="fnacimiento" class="form-label"
                >{{'MI_PERFIL.FECHA_NACIMIENTO' | translate}}</label
              >
              <input
                type="date"
                class="form-control"
                id="fnacimiento"
                [(ngModel)]="funcionesUsuario.fechaNacimientoEditada"
                name="fnacimiento"
                (ngModelChange)="actualizarEdad()"
              />
            </div>
          </ion-col>
          <ion-col>
            <div class="mb-3">
              <label for="edad" class="form-label mb-3"
                >{{'MI_PERFIL.EDAD' | translate}}</label
              >
              <br />
              <span> {{edad}} </span>
            </div>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col>
            <div class="mb-3">
              <label for="bio" class="form-label"
                >{{'MI_PERFIL.SOBRE_TI' | translate}}</label
              >
              <textarea
                class="form-control bio"
                id="bio"
                rows="5"
                placeholder="{{'MI_PERFIL.CUENTANOS' | translate}}"
                [(ngModel)]="funcionesUsuario.bioEditada"
                name="bio"
              ></textarea>
            </div>
          </ion-col>
        </ion-row>
      </ion-col>

      <ion-col>
        <!-- Tabla vehiculos -->
        <ion-row class="d-flex justify-content-center">
          <div class="contenedor_tabla">
            <app-tabla-vehiculos />
          </div>
        </ion-row>

        <!-- Preferencias -->
        <ion-row>
          <div class="mb-4 mt-4">
            <label for="preferencias" class="form-label"
              >{{'MI_PERFIL.CUANDO_VIAJO_PREFIERO' | translate}}</label
            >
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                [value]="'Hablar'"
                (change)="funcionesUsuario.actualizarPreferencias($event)"
                [checked]="funcionesUsuario.preferenciasSeleccionadas.includes('Hablar')"
                id="hablar"
              />
              <label class="form-check-label" for="hablar">
                {{'MI_PERFIL.HABLAR' | translate}}
              </label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                [value]="'Escuchar música'"
                (change)="funcionesUsuario.actualizarPreferencias($event)"
                [checked]="funcionesUsuario.preferenciasSeleccionadas.includes('Escuchar música')"
                id="escucharmusica"
              />
              <label class="form-check-label" for="escucharmusica">
                {{'MI_PERFIL.ESCUCHAR_MUSICA' | translate}}
              </label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                [value]="'Dormir'"
                (change)="funcionesUsuario.actualizarPreferencias($event)"
                [checked]="funcionesUsuario.preferenciasSeleccionadas.includes('Dormir')"
                id="Dormir"
              />
              <label class="form-check-label" for="Dormir">
                {{'MI_PERFIL.DORMIR' | translate}}
              </label>
            </div>

            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                [value]="'Ir en silencio'"
                (change)="funcionesUsuario.actualizarPreferencias($event)"
                [checked]="funcionesUsuario.preferenciasSeleccionadas.includes('Ir en silencio')"
                id="silencio"
              />
              <label class="form-check-label" for="silencio">
                {{'MI_PERFIL.SILENCIO' | translate}}
              </label>
            </div>
          </div>
        </ion-row>
      </ion-col>
    </ion-row>
  </div>
</ion-content>
