<app-navbar
  [backRoute]="'/home'"
  [searchRoute]="'search'"
  [isLoggedIn]="userLoggedIn"
></app-navbar>

<ion-content [fullscreen]="true">
  <div class="container">
    <div class="d-flex justify-content-center">
      <h1>{{'DATOS_CONTACTO.TITULO' | translate}}</h1>
    </div>
    <p class="d-flex justify-content-center">
      {{'DATOS_CONTACTO.DESCRIPCION_SECCION' | translate}}
    </p>
    <p>{{'DATOS_CONTACTO.DESCRIPCION_SECCION_2' | translate}}</p>

    <div class="container">
      <ion-row>
        <ion-col>
          <ion-row class="d-flex justify-content-center">
            <h6>{{'DATOS_CONTACTO.MODIF_CORREO_TFNO' | translate}}</h6>
          </ion-row>

          <ion-row class="mt-5 d-flex justify-content-center">
            <div class="mb-3">
              <div>
                <div>
                  <label for="email" class="form-label"
                    >{{'DATOS_CONTACTO.MI_CORREO' | translate}}</label
                  >
                </div>
              </div>
              <input
                type="email"
                class="form-control"
                id="email"
                aria-describedby="email"
                [(ngModel)]="funcionesUsuario.emailEditado"
                name="email"
              />
            </div>
          </ion-row>
          <ion-row class="d-flex justify-content-center">
            <div class="mb-3">
              <div>
                <label for="telefono" class="form-label"
                  >{{'DATOS_CONTACTO.MI_TFNO' | translate}}</label
                >
              </div>
              <input
                type="text"
                class="form-control"
                id="telefono"
                aria-describedby="telefono"
                [(ngModel)]="funcionesUsuario.telefonoEditado"
                name="telefono"
              />
            </div>
          </ion-row>
        </ion-col>

        <mat-divider vertical=""></mat-divider>
        <ion-col class="ms-5">
          <ion-row class="d-flex justify-content-center">
            <h6>{{'DATOS_CONTACTO.COM_COMERCIALES' | translate}}</h6>
          </ion-row>
          <ion-row class="mb-4 mt-5">
            <div class="form-check mb-3">
              <input
                class="form-check-input"
                type="checkbox"
                name="comunComerciales"
                id="comunComerciales"
                (change)="funcionesUsuario.preferenciasComunicacion()"
                [(ngModel)]="funcionesUsuario.comunComerciales"
              />
              <label class="form-check-label" for="flexCheckDefault">
                {{ "DATOS_CONTACTO.CHECK_POR_EMAIL" | translate }}
              </label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                name="comunTerceros"
                id="comunTerceros"
                (change)="funcionesUsuario.preferenciasComunicacion()"
                [(ngModel)]="funcionesUsuario.comunTerceros"
              />
              <label class="form-check-label" for="flexCheckChecked">
                {{ "DATOS_CONTACTO.CHECK_TERCEROS" | translate }}
              </label>
            </div>
          </ion-row>
        </ion-col>
      </ion-row>
      <div class="d-flex justify-content-center me-5 mt-5">
        <button
          type="button"
          class="btn btn_bg"
          mat-raised-button
          (click)="funcionesUsuario.editarCorreoTelefono()"
        >
          {{'BOTON.GUARDAR' | translate}}
        </button>
      </div>
    </div>
  </div>
</ion-content>
