<app-navbar [backRoute]="'/home'" [searchRoute]="'search'" [isLoggedIn]="userLoggedIn"></app-navbar>

<ion-content [fullscreen]="true">
  <ion-row class="primera-seccion">
    <div class="imagen-fondo">
      <div class="formulario-viaje">
        <form>
          <div class="contenido_formulario">
            <div class="input-container">
              <mat-icon class="input-icon">location_on</mat-icon>
              <input [(ngModel)]="origen" (input)="funcionesComunes.obtenerSugerenciasOrigen($event)"
                placeholder="{{ 'NUEVO_VIAJE.FROM' | translate }}" class="input-viaje form-control">
              <ul *ngIf="funcionesComunes.sugerenciasOrigen.length > 0" class="list-group lista_sugerencias">
                <li *ngFor="let sugerencia of funcionesComunes.sugerenciasOrigen"
                  (click)="seleccionarLocalidadOrigen(sugerencia)" [ngClass]="{'list-group-item': true}">
                  {{ sugerencia.display_name }}
                </li>
              </ul>
            </div>

            <div class="input-container">
              <mat-icon class="input-icon">location_on</mat-icon>
              <input [(ngModel)]="destino" (input)="funcionesComunes.obtenerSugerenciasDestino($event)"
    placeholder="{{ 'NUEVO_VIAJE.TO' | translate }}" class="input-viaje form-control">
  <ul *ngIf="funcionesComunes.sugerenciasDestino.length > 0" class="list-group lista_sugerencias">
    <li *ngFor="let sugerencia of funcionesComunes.sugerenciasDestino" (click)="seleccionarLocalidadDestino(sugerencia)"
      [ngClass]="{'list-group-item': true}">
      {{ sugerencia.display_name }}
    </li>
  </ul>
            </div>

            <ion-select aria-label="n_personas" placeholder="{{ 'NUEVOVIAJE.PLACE_NUM_PLAZAS' | translate }}"
              class="input-viaje form-control custom-select" [(ngModel)]="plazas" name="viajeros"
              [ngModelOptions]="{standalone: true}">
              <mat-icon slot="start">
                <span class="material-symbols-outlined"> group </span>
              </mat-icon>
              <ion-select-option value="1">1</ion-select-option>
              <ion-select-option value="2">2</ion-select-option>
              <ion-select-option value="3">3</ion-select-option>
              <ion-select-option value="4">4</ion-select-option>
            </ion-select>
            <div class="alert" *ngIf="!userLoggedIn">
              <p>{{ 'NUEVOVIAJE.NO_REGISTRADO_LOGIN' | translate }}</p>
              <div class="d-flex justify-content-center">
                <button type="button" class="help_btn d-flex justify-content-center"
                  title="Ayuda para iniciar sesión / registrarse"
                  (click)="funcionesComunes.openConfirmModal(title_help_carnet, message_help_auth)">
                  <mat-icon>help</mat-icon>
                </button>
              </div>
            </div>
            <div class="alert" *ngIf="userLoggedIn">
              <p>{{ 'NUEVOVIAJE.CARNET_NO_REGISTRADO' | translate }}</p>
              <div class="d-flex justify-content-center">
                <button type="button" class="help_btn d-flex justify-content-center"
                  title="{{'NUEVOVIAJE.AYUDA_TOOLTIP' | translate}}"
                  (click)="funcionesComunes.openConfirmModal(title_help_carnet, message_help_carnet)">
                  <mat-icon>help</mat-icon>
                </button>
              </div>
            </div>
          </div>
          <button type="button" class="btn-publicar ion-activatable ripple-parent circle"
            title="{{ 'BOTON.PUBLICAR_VIAJE' | translate }}" (click)="goTo()"
            matTooltip="{{'NUEVOVIAJE.BOTON_PUBLICAR_TOOLTIP' | translate}}">
            {{ 'BOTON.PUBLICAR_VIAJE' | translate }}<ion-ripple-effect></ion-ripple-effect>
          </button>
        </form>
      </div>
    </div>
  </ion-row>

  <ion-row class="segunda-seccion">
    <div class="centro-ayuda">
      <h2>{{ 'CENTRODEAYUDA.TITULO' | translate }}</h2>
      <p>{{ 'CENTRODEAYUDA.SUBTITULO' | translate }}</p>
      <div class="d-flex justify-content-center">
        <button type="button" mat-raised-button class="btn_bg" routerLink="/centro-ayuda">
          {{ 'BOTON.CENTROAYUDA' | translate }}
        </button>
      </div>
    </div>
  </ion-row>
</ion-content>
