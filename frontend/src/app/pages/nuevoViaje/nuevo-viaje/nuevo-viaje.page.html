<app-navbar
  [backRoute]="'/home'"
  [searchRoute]="'search'"
  [isLoggedIn]="userLoggedIn"
></app-navbar>

<ion-content [fullscreen]="true">
  <ion-row class="primera-seccion">
    <div class="imagen-fondo">
      <div class="formulario-viaje">
        <div class="contenido_formulario">
          <label class="text-start">Origen:</label>
          <div class="input-container mb-4">
            <img
              src="../../../../assets/sistema/marcador.png"
              class="marcador-icon input-icon"
            />
            <input
              #inputOrigen
              id="input-origen"
              type="text"
              class="input-viaje form-control"
              [(ngModel)]="origenCtrl.valorTexto"
              (blur)="
                  origenCtrl.estaActivo = false;
                  buscadorLocalidadesService.validarSeleccion(
                    origenCtrl,
                    inputOrigen
                  )
                "
              (focus)="origenCtrl.estaActivo = true"
              (input)="
                  buscadorLocalidadesService.obtenerSugerencias(
                    origenCtrl,
                    $event
                  )
                "
              (keydown)="manejarNavegacionTeclado($event, 'origen')"
              autocomplete="off"
              spellcheck="false"
              [placeholder]="'BUSCADOR.PLACEHOLDER_LOCALIDAD' | translate"
              role="combobox"
              aria-autocomplete="list"
              aria-haspopup="listbox"
              aria-describedby="instrucciones-busqueda"
              [attr.aria-expanded]="origenCtrl.sugerencias.length > 0"
              [attr.aria-controls]="
                  origenCtrl.sugerencias.length > 0
                    ? 'lista-origen-resultados'
                    : null
                "
              [attr.aria-activedescendant]="
                  origenCtrl.indiceActivo >= 0
                    ? 'opt-orig-' + origenCtrl.indiceActivo
                    : null
                "
            />
            <div
              *ngIf="cargandoOrigen"
              class="spinner-container spinner-input-inline"
            >
              <app-spinner></app-spinner>
            </div>
            <ul
              id="lista-origen-resultados"
              *ngIf="origenCtrl.sugerencias.length > 0"
              class="list-group lista_sugerencias"
              role="listbox"
              aria-live="polite"
            >
              <li
                [id]="'opt-orig-' + i"
                *ngFor="
                    let localidad of origenCtrl.sugerencias;
                    let i = index
                  "
                class="list-group-item"
                (mousedown)="
                    $event.preventDefault();
                   buscadorLocalidadesService.seleccionarLocalidad(origenCtrl, localidad, inputOrigen)
                  "
                [class.active]="i === origenCtrl.indiceActivo"
                role="option"
                tabindex="-1"
                (click)="buscadorLocalidadesService.seleccionarLocalidad(origenCtrl, localidad, inputOrigen)"
                (keyup.enter)="buscadorLocalidadesService.seleccionarLocalidad(origenCtrl, localidad, inputOrigen)"
                (keydown)="manejarNavegacionTeclado($event, 'origen', i)"
              >
                {{ localidad.descripcion }}
              </li>
            </ul>
          </div>

          <div class="input-container">
            <button
              type="button"
              class="btn btn_bg mb-3"
              (click)="buscarUbicacion()"
            >
              <span>
                <i class="fi fi-rr-marker"></i>
                Mi ubicación
              </span>
            </button>
          </div>

          <label class="text-start">Destino:</label>
          <div class="input-container">
            <img
              src="../../../../assets/sistema/viaje-en-coche.png"
              class="marcador-icon input-icon"
            />
            <input
              #inputDestino
              id="input-destino"
              type="text"
              class="input-viaje form-control"
              [(ngModel)]="destinoCtrl.valorTexto"
              (blur)="
                  destinoCtrl.estaActivo = false;
                  buscadorLocalidadesService.validarSeleccion(
                    destinoCtrl,
                    inputDestino
                  )
                "
              (focus)="destinoCtrl.estaActivo = true"
              (input)="
                  buscadorLocalidadesService.obtenerSugerencias(
                    destinoCtrl,
                    $event
                  )
                "
              (keydown)="manejarNavegacionTeclado($event, 'destino')"
              autocomplete="off"
              spellcheck="false"
              [placeholder]="'BUSCADOR.PLACEHOLDER_LOCALIDAD' | translate"
              role="combobox"
              aria-autocomplete="list"
              aria-haspopup="listbox"
              aria-describedby="instrucciones-busqueda"
              [attr.aria-expanded]="destinoCtrl.sugerencias.length > 0"
              [attr.aria-controls]="
                  destinoCtrl.sugerencias.length > 0
                    ? 'lista-destino-resultados'
                    : null
                "
              [attr.aria-activedescendant]="
                  indiceActivoDestino >= 0
                    ? 'opt-dest-' + indiceActivoDestino
                    : null
                "
            />
            <!-- Spinner de carga -->
            <div
              *ngIf="cargandoDestino"
              class="spinner-container spinner-input-inline"
            >
              <app-spinner></app-spinner>
            </div>

            <ul
              *ngIf="destinoCtrl.sugerencias.length > 0"
              class="list-group lista_sugerencias"
              id="lista-destino-resultados"
              role="listbox"
              aria-live="polite"
            >
              <li
                [id]="'opt-dest-' + i"
                *ngFor="
                    let localidad of destinoCtrl.sugerencias;
                    let i = index
                  "
                class="list-group-item"
                [class.active]="i === indiceActivoDestino"
                (keydown)="manejarNavegacionTeclado($event, 'destino', i)"
                (mousedown)="
                    $event.preventDefault();
                    buscadorLocalidadesService.seleccionarLocalidad(destinoCtrl, localidad, inputDestino)
                  "
                role="option"
                tabindex="-1"
                (click)="buscadorLocalidadesService.seleccionarLocalidad(destinoCtrl, localidad, inputDestino)"
                (keyup.enter)="buscadorLocalidadesService.seleccionarLocalidad(destinoCtrl, localidad, inputDestino)"
              >
                {{ localidad.descripcion }}
              </li>
            </ul>
          </div>

          <!-- SELECTOR DE PLAZAS  -->
          <label class="text-start mt-4">Plazas disponibles:</label>
          <div
            class="select-container custom-dropdown mb-3"
            (click)="toggleDropdown()"
            [class.open]="isOpen"
          >
            <img
              src="../../../../assets/sistema/usuarios-alt.png"
              class="select-icon"
              alt="icono usuarios"
            />

            <div class="selected-value">
              {{ plazas || ('NUEVOVIAJE.PLACE_NUM_PLAZAS' | translate) }}
            </div>

            <ul
              class="custom-options"
              *ngIf="isOpen"
            >
              <li
                (click)="selectOption('1')"
                [class.selected]="plazas === '1'"
              >
                1
              </li>
              <li
                (click)="selectOption('2')"
                [class.selected]="plazas === '2'"
              >
                2
              </li>
              <li
                (click)="selectOption('3')"
                [class.selected]="plazas === '3'"
              >
                3
              </li>
              <li
                (click)="selectOption('4')"
                [class.selected]="plazas === '4'"
              >
                4
              </li>
            </ul>
          </div>

          <div
            class="alert"
            *ngIf="!userLoggedIn"
          >
            <p>{{ 'NUEVOVIAJE.NO_REGISTRADO_LOGIN' | translate }}</p>
            <div class="d-flex justify-content-center">
              <button
                type="button"
                class="help_btn d-flex justify-content-center"
                title="Ayuda para iniciar sesión / registrarse"
                (click)="funcionesComunes.openConfirmModal(title_help_carnet, message_help_auth)"
              >
                <img
                  src="../../../../assets/sistema/interrogatorio.png"
                  class="marcador-icon input-icon"
                />
              </button>
            </div>
          </div>
        </div>
        <button
          type="button"
          class="btn-publicar ion-activatable ripple-parent circle"
          title="{{ 'BOTON.PUBLICAR_VIAJE' | translate }}"
          (click)="goTo()"
          matTooltip="{{'NUEVOVIAJE.BOTON_PUBLICAR_TOOLTIP' | translate}}"
        >
          {{ 'BOTON.PUBLICAR_VIAJE' | translate }}
          <ion-ripple-effect></ion-ripple-effect>
        </button>
      </div>
    </div>
  </ion-row>

  <ion-row class="segunda-seccion">
    <div class="centro-ayuda">
      <h2>{{ 'CENTRODEAYUDA.TITULO' | translate }}</h2>
      <p>{{ 'CENTRODEAYUDA.SUBTITULO' | translate }}</p>
      <div class="d-flex justify-content-center">
        <button
          type="button"
          mat-raised-button
          class="btn_bg"
          routerLink="/centro-ayuda"
        >
          <img
            src="../../../../assets/sistema/interrogatorio.png"
            class="marcador-icon input-icon"
          />
          {{ 'BOTON.CENTROAYUDA' | translate }}
        </button>
      </div>
    </div>
  </ion-row>
  <ion-fab
    vertical="bottom"
    horizontal="start"
    slot="fixed"
    class="fab-ajustes fab-buscar"
  >
    <ion-fab-button
      aria-label="Ir atrás"
      (click)="goBack()"
    >
      <img
        [src]="irAtrasImg"
        alt="Ir atrás"
        style="width: 24px; height: 24px"
      />
    </ion-fab-button>
  </ion-fab>
</ion-content>
