<div class="container">
  <h1>PUNTO DE PARTIDA</h1>

  <app-selector-general
    idUnico="origen"
    labelKey=""
    placeholderKey="NUEVO_VIAJE2.FROM"
    [opciones]="sugerenciasOrigen"
    [valor]="origen"
    [permitirTextoLibre]="true"
    [mostrarFlechaSelector]="false"
    (textoCambiado)="buscarSugerenciasOrigen($event)"
    (seleccionCambiada)="seleccionarLocalidadOrigen($event)"
  ></app-selector-general>

  <button
    type="button"
    mat-raised-button
    class="btn_bg mt-2"
    (click)="getUserLocationWithLeaflet()"
  >
    <img
      src="../../../../../../assets/sistema/marcador.png"
      class="_icon me-3"
    />
    Usar mi ubicación
  </button>

  <div
    *ngIf="cargandoOrigen"
    class="spinner-container"
  >
    <app-spinner></app-spinner>
  </div>
</div>

<div class="container mt-4">
  <h1>LUGAR DE LLEGADA</h1>

  <app-selector-general
    idUnico="destino"
    labelKey=""
    placeholderKey="NUEVO_VIAJE2.TO"
    [opciones]="sugerenciasDestino"
    [valor]="destino"
    [permitirTextoLibre]="true"
    [mostrarFlechaSelector]="false"
    (textoCambiado)="buscarSugerenciasDestino($event)"
    (seleccionCambiada)="seleccionarLocalidadDestino($event)"
  ></app-selector-general>

  <div
    *ngIf="cargandoDestino"
    class="spinner-container"
  >
    <app-spinner></app-spinner>
  </div>
</div>
