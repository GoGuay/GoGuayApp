<div id="cuarto_paso" class="animate__animated animate__fadeIn">
  
  <div class="container text-center pt-2 pb-4 shadow-container">
    <div class="badge-step mb-2">Último paso</div>
    <h1 class="main-step-title">Fija el precio por plaza</h1>
    
    <div class="recommendation-box mt-3 mx-auto">
      <span class="recommend-tag">
        <i class="fi fi-rr-coins me-1"></i> Rango recomendado: <strong>{{ precioMinRecomendado }}€ - {{ precioMaxRecomendado }}€</strong>
      </span>
      <p class="recommend_info mt-2 mb-0">
        Conseguirás pasajeros más fácilmente si configuras un precio cercano al recomendado.
      </p>
    </div>
  </div>

  <div class="container d-flex justify-content-center mt-4 mb-4">
    <div class="price-counter-wrapper">
      
      <button type="button" class="precio_btn btn-restar" (click)="restarCantidad()" [disabled]="precio <= 1">
        <i class="fi fi-rr-minus"></i>
      </button>
      
      <div class="price-display-box" [style.color]="getprecioColor()">
        <span class="font_precio">{{ precio }}</span>
        <span class="currency-label">€</span>
      </div>
      
      <button type="button" class="precio_btn btn-sumar" (click)="sumarCantidad()" [disabled]="precio >= 99">
        <i class="fi fi-rr-plus"></i>
      </button>

      <div class="help-icon-wrapper" (click)="ayudaPrecio()" matTooltip="¿Cómo se calcula?" matTooltipPosition="above">
        <i class="fi fi-rr-interrogation"></i>
      </div>
      
    </div>
  </div>

  <p-toast position="bottom-center" key="precioToast"></p-toast>
</div>
