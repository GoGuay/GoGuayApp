<app-navbar
  [origin]="'/nuevo-viaje'"
  [backRoute]="'/nuevo-viaje'"
  [searchRoute]="'search'"
  [isLoggedIn]="userLoggedIn"
></app-navbar>

<ion-content [fullscreen]="true">
  @if (mostrarJumbotron && !cuarto_paso && !tercer_paso && !segundo_paso) {
  <div>
    <app-jumbotron
      [title]="'Un espacio seguro para compartir cada kilómetro.'"
      [imageSrc]="'../../assets/folder/jumbo4.jpg'"
      [helpText]="'JUMBOTRON.HELP'"
    ></app-jumbotron>
  </div>
  }

  <app-resumen-dinamico></app-resumen-dinamico>

  @if (primer_paso) {
  <div
    class="container"
    id="primer_paso"
  >
    <app-primer-paso></app-primer-paso>
    <div class="d-flex justify-content-center mt-3 mb-3">
      <p-toast position="bottom-center"></p-toast>
      <button
        type="button"
        mat-raised-button
        class="btn_bg"
        (click)="onPrimerPasoComplete()"
      >
        Continuar
      </button>
    </div>
  </div>
  } @if (segundo_paso) {
  <div
    class="container"
    id="segundo_paso"
  >
    <app-segundo-paso></app-segundo-paso>
    <div class="d-flex justify-content-center mt-3 mb-3 btn-banner">
      <button
        type="button"
        mat-raised-button
        class="btn_bg"
        (click)="onSegundoPasoBack()"
      >
        Atrás
      </button>
      <button
        type="button"
        mat-raised-button
        class="btn_bg"
        (click)="onSegundoPasoComplete()"
      >
        Continuar
      </button>
    </div>
  </div>
  } @if (tercer_paso) {
  <div>
    <app-tercer-paso></app-tercer-paso>
    <div class="d-flex justify-content-center mt-3 mb-3 btn-banner">
      <button
        type="button"
        mat-raised-button
        class="btn_bg"
        (click)="onTercerPasoBack()"
      >
        Atrás
      </button>
      <button
        type="button"
        mat-raised-button
        class="btn_bg"
        (click)="onTercerPasoComplete()"
      >
        Continuar
      </button>
    </div>
  </div>
  } @if (cuarto_paso) {
  <div class="container">
    <p-toast position="bottom-center"></p-toast>
    <app-cuarto-paso #pasoPrecio></app-cuarto-paso>
    <div class="d-flex justify-content-center mt-4 mb-3 btn-banner">
      <button
        type="button"
        mat-raised-button
        class="btn_bg"
        (click)="onCuartoPasoBack()"
      >
        Atrás
      </button>
      <button
        type="button"
        mat-raised-button
        class="btn_bg"
        (click)="publicarViajeFinal(pasoPrecio)"
      >
        Publicar Viaje
      </button>
    </div>
  </div>
  }
</ion-content>
