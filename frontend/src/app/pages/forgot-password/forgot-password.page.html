<app-navbar
  [backRoute]="'/home'"
  [searchRoute]="'search'"
  [isLoggedIn]="userLoggedIn"
></app-navbar>
<ion-content [fullscreen]="true">
  <div class="container d-flex flex-column align-items-center">
    <div class="d-flex justify-content-center">
      <h2>¿CONTRASEÑA OLVIDADA?</h2>
    </div>
    <p class="d-flex justify-content-center">
      Todes podemos tener un despiste. Aquí te ayudamos.
    </p>
    <p class="d-flex justify-content-center descripcion mb-5">
      Confirma tu correo electrónico, te enviaremos un enlace para crear una
      nueva contraseña
    </p>
  </div>
  <div>
    <ion-row class="d-flex justify-content-center">
      <ion-col size="2">
        <div class="mb-3" *ngIf="userLoggedIn">
          <input
            type="email"
            class="form-control"
            id="emailControl"
            aria-describedby="email"
            [(ngModel)]="emailUsuario"
            disabled=""
          />
        </div>
        <div class="mb-3" *ngIf="!userLoggedIn">
          <input
            type="email"
            class="form-control"
            id="emailControl"
            aria-describedby="email"
            [(ngModel)]="emailUsuario"
          />
        </div>
        <div class="d-flex justify-content-center">
          <button
            class="btn btn_bg"
            (click)="envio_email_reset_password(emailUsuario)"
          >
            Enviar
          </button>
          <p-toast position="bottom-center"></p-toast>
        </div>
      </ion-col>
    </ion-row>
  </div>
</ion-content>
