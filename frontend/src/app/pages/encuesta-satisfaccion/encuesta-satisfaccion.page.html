<ion-header>
  <!-- <ion-toolbar>
    <ion-title class="text-center">Encuesta</ion-title>
  </ion-toolbar> -->
</ion-header>

<ion-content [fullscreen]="true">
  <form [formGroup]="encuestaForm" (ngSubmit)="verificarEncuesta()">
    <div class="container justify-content-center main_container">
      <div class="encuesta_box mt-4">

        <div class="container mb-3 row">
          <h1><strong>Queremos escuchar tu opinión</strong></h1>
        </div>

        <div class="container mb-3 row">
          <h3>1. ¿Con qué probabilidad recomendarías PrideRide para realizar viajes a un familiar o amigo?</h3>
          <div class="d-flex justify-content-center starsContainer">
            <img *ngFor="let estrella of estrellas; let i = index"
              src="{{ i < calificacionSeleccionada ? '../../../assets/rating/como.gif' : '../../../assets/rating/favorito.gif' }}"
              class="stars" type="button" (click)="seleccionarCalificacion(i + 1)">
          </div>
        </div>

        <div class="container mb-3 row">
          <h3>2. ¿Nos podrías indicar qué es lo que más te ha gustado?</h3>
          <div class="container">
            <table class="table table-hover tabla">
              <thead>
                <tr>
                  <th scope="col"></th>
                  <th scope="col">😄</th>
                  <th scope="col">🫤</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let aspecto of aspectos; let i = index">
                  <td>{{ aspecto.nombre }}</td>
                  <td>
                    <mat-checkbox [formControlName]="'positivo' + i" (change)="toggleCheckbox(i, 'positivo')">
                    </mat-checkbox>
                  </td>
                  <td>
                    <mat-checkbox [formControlName]="'negativo' + i" (change)="toggleCheckbox(i, 'negativo')">
                    </mat-checkbox>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="container mb-3 row">
          <h3>3. Nos ayudaría mucho si nos compartes cómo crees que podemos mejorar la aplicación.</h3>
          <div class="ms-3">
            <textarea class="textArea form-control" maxlength="500" formControlName="sugerencias"></textarea>
          </div>
        </div>

      </div>

      <div class="d-flex justify-content-end">
        <div class="container mb-3 mt-3 row btn_box">
          <button type="submit" class="btn_bg" mat-raised-button>Enviar</button>
        </div>
      </div>

    </div>
  </form>
</ion-content>
