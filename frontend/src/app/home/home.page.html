<ion-header>
  <app-navbar [isLoggedIn]="userLoggedIn"></app-navbar>
</ion-header>
<ion-content fullscreen>
  <!-- COMPONENTE DEL JUMBOTRON -->
  <div *ngIf="mostrarJumbotron">
    <app-jumbotron [title]="'HOME.JUMBO.SLOGAN' | translate"
      [imageSrc]="'../../assets/banco_imagenes/img1.png'"></app-jumbotron>
  </div>

  <div class="contenido_principal">
    <ion-grid>
      <ion-row>
        <ion-col size="12" size-md="6">
          <!-- COMPONENTE PARA PUBLICAR UN NUEVO VIAJE -->
          <div id="publicar_viaje">
            <app-nuevo-viaje-general></app-nuevo-viaje-general>
          </div>
        </ion-col>

        <ion-col size="12" size-md="6">
          <!-- COMPONENTE PARA PUBLICAR UN NUEVO VIAJE -->
          <div id="buscar_viaje">
            <app-buscador-viaje-home></app-buscador-viaje-home>
          </div>
        </ion-col>
      </ion-row>
    </ion-grid>

    <!-- COMPONENTE DE TRAYECTOS MAS POPULARES -->
    <div class="d-flex justify-content-center p-2">
      <app-trayectos-populares></app-trayectos-populares>
    </div>

    <!-- COMPONENTE DE VIAJES RECOMENDADOS POR IA (SOLO SI EL USUARIO HA INICIADO SESIÓN Y HA CONFIGURADO SUS INTERESES)  -->
    <div class="d-flex justify-content-center p-2" *ngIf="iaActiva">
      <app-viajes-recomendados-ia></app-viajes-recomendados-ia>
    </div>

    <!-- COMPONENTE DE LAS DUDAS GENERALES -->
    <div class="d-flex justify-content-center p-2 mb-3">
      <app-ventana-dudas></app-ventana-dudas>
    </div>
  </div>

  <div class="survey-floating-banner animate__animated animate__fadeInUp" *ngIf="mostrarBannerEncuesta">
    <button class="btn-close-banner" (click)="cerrarBannerEncuesta()" aria-label="Cerrar">
      <i class="fi fi-rr-cross-small"></i>
    </button>
    <div class="banner-content d-flex align-items-center gap-3">
      <div class="banner-icon-wrapper">
        <i class="fi fi-rr-heart text-primary"></i>
      </div>
      <div class="banner-text">
        <h6 class="fw-bold mb-1">¿Qué te parece GoGuay?</h6>
        <p class="small text-muted mb-0">Ayúdanos a mejorar valorando tu experiencia.</p>
      </div>
      <button class="btn btn_bg btn-sm rounded-pill px-3 ms-auto" (click)="irAEncuesta()">
        Valorar
      </button>
    </div>
  </div>

  <!-- MariCar -->
  <div class="maricar-container-fixed" *ngIf="asistenteActiva">

    <div class="maricar-popover" @popoverAnimation *ngIf="mostrarPopoverMaricar">
      <button class="btn-close-popover" (click)="cerrarPopoverMaricar($event)" aria-label="Cerrar">
        <ion-icon name="close-outline"></ion-icon>
      </button>
      <div class="popover-content d-flex align-items-center gap-2">
        <span class="popover-text">Hola, soy <strong>MariCar</strong>, tu asistente virtual 🚗✨</span>
      </div>
      <div class="popover-arrow"></div>
    </div>

    <ion-fab vertical="bottom" horizontal="start" slot="fixed" class="fab-maricar-izquierda">
      <ion-fab-button (click)="abrirChatMariCar()" class="maricar-fab-button" title="Hablar con MariCar">
        <div class="maricar-icon-wrapper">
          <ion-icon name="car-sport-outline" class="car-icon"></ion-icon>
          <ion-icon name="sparkles" class="sparkle-icon"></ion-icon>
        </div>
      </ion-fab-button>
    </ion-fab>

  </div>

   <p-toast key="home-toast" styleClass="home-toast-home" position="bottom-center"></p-toast>
</ion-content>

<ion-footer>
  <app-footer></app-footer>
</ion-footer>
