<ion-header>
  <ng-container *ngIf="validacionHomePage; else otherPageNav">
    <nav class="navbar navbar-expand-lg navbar-diseno">
      <div class="container">
        <div class="d-flex align-items-center d-lg-none w-100">
          <a class="navbar-brand p-0" href="#">
            <img src="../../../assets/logo/PRIDECAR.png" alt="Logo" class="logo logo-mobile-small" />
            <h1 class="m-0 text-center d-none">{{ 'TITLE' | translate }}</h1>
          </a>

          <button
            class="navbar-toggler me-2"
            type="button"
            data-bs-toggle="collapse"
            (click)="toggleMenu()"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation">
            <mat-icon *ngIf="!menuOpen">menu</mat-icon>
            <mat-icon *ngIf="menuOpen">close</mat-icon>
          </button>
        </div>

        <div class="collapse navbar-collapse row" id="navbarSupportedContent">
          <ul class="navbar-nav w-100 align-items-center justify-content-center flex-row">
            <div class="d-flex align-items-center me-auto flex-column flex-lg-row">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="/sobre-nosotros">
                  {{ 'NAVBAR.QUIENES' | translate }}
                </a>
              </li>
              <li class="nav-item ion-activatable ripple-parent circle">
                <a class="nav-link active" aria-current="page" href="/faqs">
                  {{ 'NAVBAR.FAQS' | translate }}
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="/decalogo">
                  {{ 'NAVBAR.DECALOGO' | translate }}
                </a>
              </li>
            </div>

            <li class="nav-item d-none d-lg-flex flex-column align-items-center mx-auto logo-principal">
              <a class="" href="#">
                <img src="../../../assets/logo/PRIDECAR.png" alt="Logo" class="logo" />
              </a>
              <h1 class="m-0 text-center">{{ 'TITLE' | translate }}</h1>
            </li>

            <div class="d-flex ms-auto d-none d-lg-block"></div>
          </ul>
        </div>

        <div class="d-flex align-items-center ms-auto">
          <li class="nav-item list-unstyled">
            <a class="nav-link active d-flex align-items-center" aria-current="page" href="/busqueda-viajes">
              <span class="d-none d-lg-block">{{ 'NAVBAR.BUSCAR_VIAJE' | translate }}</span>
              <img src="../../../assets/sistema/busqueda.png" class="search-icon" />
            </a>
          </li>

          <li class="nav-item list-unstyled">
            <a class="nav-link active d-flex align-items-center" href="/nuevo-viaje" aria-current="page">
              <span class="d-none d-lg-block">{{ 'NAVBAR.PUBLICAR_VIAJE' | translate }}</span>
              <mat-icon class="d-lg-none d-block">add_circle_outline</mat-icon>
            </a>
          </li>

          <li class="nav-item dropdown list-unstyled d-none d-sm-block">
            <a class="nav-link active" aria-current="page" href="/notificaciones">
              <img class="idiomas" src="../../../assets/sistema/campana.gif" />
            </a>
          </li>

          <div class="d-flex justify-content-center align-items-center ms-3 me-3">
            <img
              src="../../../assets/idiomas/bandera_es.svg"
              class="icon-idioma me-2"
              [ngClass]="{ 'grayscale-filter': selectedLanguage !== 'es' }"
              (click)="changeLanguage('es')"
              alt="Seleccionar idioma español"
              role="button" />
            <img
              src="../../../assets/idiomas/bandera_uk.svg"
              class="icon-idioma"
              [ngClass]="{ 'grayscale-filter': selectedLanguage !== 'en' }"
              (click)="changeLanguage('en')"
              alt="Select English language"
              role="button" />
          </div>

          <ng-container *ngIf="isLoggedIn; else loggedOutNav">
            <li class="nav-item dropdown list-unstyled"></li>
          </ng-container>
          <ng-template #loggedOutNav>
            <li class="nav-item dropdown list-unstyled"></li>
          </ng-template>
        </div>
      </div>
    </nav>
  </ng-container>

  <ng-template #otherPageNav></ng-template>
</ion-header>
